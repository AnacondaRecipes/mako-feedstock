{% set name = "Mako" %}
{% set version = "1.4.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: cd6537fe88d5fec315c55c2f8529bc4ce7a9a352ad7db3eeaa6a66e2dd4ec37a

build:
  number: 0
  skip: true  # [py<310]
  entry_points:
    - mako-render=mako.cmd:cmdline
  script: python -m pip install --no-deps --no-build-isolation --ignore-installed . -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=77.0.0
  run:
    - python
    - markupsafe >=2.0
  run_constrained:
    # lingua extra; the babel extra is unversioned upstream (no-op here) and testing is dev-only
    - lingua >=4.16

test:
  source_files:
    - test
    - pyproject.toml
    - setup.cfg
  imports:
    - mako
    - mako.ext
    - mako.template
  requires:
    - pytest
    - pip
    - babel
    - pygments
  commands:
    - pip check
    - mako-render --help
    - pytest -v test

about:
  home: https://www.makotemplates.org
  license_file: LICENSE
  license: MIT
  license_family: MIT
  summary: A super-fast templating language that borrows the best ideas from the existing templating languages.
  description: |
    Mako is a template library written in Python. It provides a familiar,
    non-XML syntax which compiles into Python modules for maximum performance.
  doc_url: https://docs.makotemplates.org
  dev_url: https://github.com/sqlalchemy/mako

extra:
  recipe-maintainers:
    - pmlandwehr
